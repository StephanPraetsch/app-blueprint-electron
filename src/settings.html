<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Settings</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body class="settings-window">
    <h1>Settings</h1>

    <section class="panel settings-panel standalone-settings-panel">
      <p class="settings-label">Database file</p>
      <p id="database-file-path" class="database-path">Loading...</p>
      <div class="button-row">
        <button id="open-database-file-button" class="action-button" type="button">Open in File Browser</button>
        <button id="change-database-file-button" class="action-button" type="button">Change Database File Path</button>
      </div>
      <p id="settings-status" class="settings-status" aria-live="polite"></p>
    </section>

    <div class="close-button-row">
      <button id="close-settings-button" class="action-button" type="button">Close</button>
    </div>

    <script type="module" src="./settings.js"></script>
  </body>
</html>
